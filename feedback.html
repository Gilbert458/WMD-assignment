  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-mask"></i> AniMerch</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>

        <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="page-header">
  <div class="container"><h1>We Value Your Feedback</h1><p>Help us improve by sharing your experience</p></div>
</section>

<section class="section-padding">
  <div class="container">
    <div class="col-lg-8 mx-auto">
      <form id="feedbackForm" class="feedback-form">
        <h3 class="text-center mb-4" style="color: var(--orange);">Share Your Thoughts</h3>

        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label>Rate us <span class="required">*</span></label>
          <div class="rating-stars">
            <input type="radio" name="rating" value="5" id="s5"><label for="s5">★</label>
            <input type="radio" name="rating" value="4" id="s4"><label for="s4">★</label>
            <input type="radio" name="rating" value="3" id="s3"><label for="s3">★</label>
            <input type="radio" name="rating" value="2" id="s2"><label for="s2">★</label>
            <input type="radio" name="rating" value="1" id="s1"><label for="s1">★</label>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Your Feedback <span class="required">*</span></label>
          <textarea id="message" class="form-control" placeholder="Tell us what you think..." required></textarea>
        </div>

        <div class="form-group">
          <label for="suggestions">Suggestions</label>
          <textarea id="suggestions" class="form-control" placeholder="What would you like to see?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Submit Feedback <i class="fas fa-paper-plane"></i></button>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom text-center">&copy; 2026 AniMerch. All rights reserved.</div>
  </div>

</html>
